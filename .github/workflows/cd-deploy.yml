name: CD Deploy (Production)

on:
  push:
    branches:
      - main

jobs:
  build-backend:
    name: Build & Package Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Publish Backend
        run: |
          dotnet restore Backend/Backend/Backend.csproj
          dotnet publish Backend/Backend/Backend.csproj -c Release -o ./publish/backend

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: ./publish/backend

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

  deploy:
    name: Deploy to Production
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: ./backend-release

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend-release

      - name: Deployment Execution
        run: |
          echo "========================================================="
          echo "Build & Artifact Packaging completed successfully!"
          echo "Artifacts are ready in ./backend-release and ./frontend-release"
          echo "Placeholder: Add your target cloud / VPS / hosting provider deploy commands here."
          echo "========================================================="
